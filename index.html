<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyOrder</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <h1>EasyOrder</h1>
        <p>Seja bem-vindo ao sistema de autoatendimento!</p>
    </header>

    <main>
        <section id="menu">
            <h2>Cardápio</h2>
            <ul id="menu-list">
                <!-- Os itens do menu serão adicionados dinamicamente pelo JavaScript -->
            </ul>
        </section>

        <section id="cart">
            <h2>Carrinho</h2>
            <ul id="cart-list">
                <!-- Itens adicionados ao carrinho aparecerão aqui -->
            </ul>
            <p id="total">Total: R$ 0.00</p>
            <button id="checkout">Finalizar Pedido</button>
        </section>
    </main>

    <footer>
        <p>© 2025 EasyOrder. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
